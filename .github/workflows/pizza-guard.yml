name: Pizza Guard APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'source-parts/**'
      - '.github/workflows/pizza-guard.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify and extract source
        run: |
          cat source-parts/part-* > /tmp/pizzaguard.tar.xz
          echo '7e4dd2c360b7ef20ecb0a5be4b7260ce15883768910aacd87459537b95e4fd45  /tmp/pizzaguard.tar.xz' | sha256sum -c -
          mkdir project
          tar -xJf /tmp/pizzaguard.tar.xz -C project
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PizzaGuard-1.0.3-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
