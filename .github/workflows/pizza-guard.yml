name: Pizza Guard APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'PizzaGuard-1.0.3-Root-AndroidStudio.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract source
        run: unzip -q PizzaGuard-1.0.3-Root-AndroidStudio.zip -d project
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK
        working-directory: project
        run: bash gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PizzaGuard-1.0.3-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
